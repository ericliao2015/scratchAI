name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      env:
        CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
    - run: npm run build
      env:
        NODE_ENV: production
        # GitHub Pages serves the site under /<repository name>/
        ROOT: /${{ github.event.repository.name }}/
        # Cache the editor for offline use (src/playground/service-worker.js)
        ENABLE_SERVICE_WORKER: '1'
    - run: touch build/.nojekyll
    - uses: actions/upload-pages-artifact@v3
      with:
        path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
