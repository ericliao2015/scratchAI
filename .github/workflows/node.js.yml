name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      env:
        CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
        # A git dependency builds itself with playwright; its browser download is not needed and can time out.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    - run: npm run build
    - run: npm run test:unit
    - name: Lint AI code
      run: npx eslint src/ai src/components/ai-panel src/containers/ai-panel-host.jsx server
